name: Rakenna Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hae koodi
        uses: actions/checkout@v4

      - name: Aseta Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Aseta Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Asenna riippuvuudet ja synkronoi
        run: |
          npm install
          npx cap sync android

      - name: Anna suoritusoikeudet Gradlelle
        run: chmod +x android/gradlew

      - name: Kaanna APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Julkaise suora latauslinkki (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: YardFlow APK v1.0.0 (Build ${{ github.run_number }})
          files: android/app/build/outputs/apk/debug/app-debug.apk
